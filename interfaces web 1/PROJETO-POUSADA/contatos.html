<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Entre em contato com a pousada Snow Valley." />
  <title>Contato | Pousada Snow Valley</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
</head>

<body class="pagina-contato">
  <header>
    <nav class="navbar">
      <div class="logo">
        <img src="images/galo_snow-Valley.png" alt="" />
        <h1>Snow Valley</h1>
      </div>

      <input type="checkbox" id="menu-toggle" class="menu-toggle" />

      <label for="menu-toggle" class="menu-icon" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <ul class="menu-list">
        <li><a href="inicio.html">Início</a></li>
        <li><a href="inicio.html">Sobre</a></li>
        <li><a href="inicio.html">Serviços</a></li>
        <li><a href="contatos.html" aria-current="page">Contato</a></li>
        <li><a href="#contato-form">Reservas</a></li>
      </ul>
    </nav>
  </header>
  <main class="contato-main">
    <h1>Contato</h1>
    <p>Envie uma mensagem para a Snow Valley.</p>

    <form class="form-contato" id="contato-form">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" autocomplete="name" required />

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required />

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="4" required></textarea>

      <button>Envio em breve</button>
    </form>
  </main>
</body>

</html>
