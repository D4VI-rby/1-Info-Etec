<script>
    var idade = parseInt(prompt("coloque a idade do aluno"));
    switch(idade){
        case 1:
        case 2:
        case 3:
        case 4:
        case 5:
        case 6:
            alert('dente de leite')
            break;    
        case 7:
            alert('júnior')
            break;    
        case 8:
            alert('júnior max')
            break;
        case 9:
            alert('júnior master')
            break;
        case 10:
            alert('master')
            break;
        default:
            alert("idade invalida")
        
    }
</script>
