<script>
    var mes=parseFloat(prompt("Entre com o seu mês de nascimento"));
    var dia=parseFloat(prompt("Entre com o seu dia de nascimento"));

    switch(mes){
        case 1:
            if(dia<=20){
                document.write("Capricórnio");
            } else if(dia<=31){
                document.write("Aquário");
            } else{
                document.write("Dia inválido.");
            }
            break;
        case 2:
        if(dia<=18){
                document.write("Aquário");
            } else if(dia<=28){
                document.write("Peixes");
            } else{
                document.write("Dia inválido.");
            }
            break;

        case 3:
        if(dia<=20){
                document.write("Peixes");
            } else if(dia<=31){
                document.write("Áries");
            } else{
                document.write("Dia inválido.");
            }
            break;

        case 4:
        if(dia<=20){
                document.write("Áries ");
            } else if(dia<=30){
                document.write("Touro");
            } else{
                document.write("Dia inválido.");
            }
            break;

        case 5:
        if(dia<=20){
                document.write("Touro");
            } else if(dia<=31){
                document.write("Gêmeos");
            } else{
                document.write("Dia inválido.");
            }
            break;

        case 6:
        if(dia<=20){
                document.write("Gêmeos");
            } else if(dia<=31){
                document.write("Câncer");
            } else
                document.write("Dia inválido.");
            
            break;

        case 7:
        if(dia<=20){
                document.write("Câncer");
            } else if(dia<=31){
                document.write("Leão");
            } else{
                document.write("Dia inválido.");
            }
            break;

        case 8:
        if(dia<=20){
                document.write("Leão");
            } else if(dia<=31){
                document.write("Virgem");
            } else{
                document.write("Dia inválido.");
            }
            break;

        case 9:
        if(dia<=20){
                document.write("Virgem");
            } else if(dia<=30){
                document.write("Libra");
            } else{
                document.write("Dia inválido.");
            }
            break;

        case 10:
        if(dia<=20){
                document.write("Libra");
            } else if(dia<=31){
                document.write("Escorpião");
            } else{
                document.write("Dia inválido.");
            }
            break;

        case 11:
        if(dia<=20){
                document.write("Escorpião");
            } else if(dia<=30){
                document.write("Sagitário");
            } else{
                document.write("Dia inválido.");
            }
            break;

        case 12:
        if(dia<=20){
                document.write("Sagitário");
            } else if(dia<=31){
                document.write("Capricórnio");
            } else{
                document.write("Dia inválido.");
            }
            break;

        default:
            document.write("Mês inválido");
    
    }
</script>
