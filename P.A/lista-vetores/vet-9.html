<script>
  
let vetorA = [];
let vetorB = [];
let vetorC = [];

for (let i = 0; i < 5; i++) {
    vetorA[i] = Number(prompt("Digite um número para o vetor A:"));
}

for (let i = 0; i < 5; i++) {
    vetorB[i] = Number(prompt("Digite um número para o vetor B:"));
}

for (let i = 0; i < 5; i++) {
    vetorC[i] = vetorA[i] + vetorB[i];
}

document.write("Vetor A: " + vetorA + "<br>");
document.write("Vetor B: " + vetorB + "<br>");
document.write("Vetor C: " + vetorC + "<br>");

</script>
