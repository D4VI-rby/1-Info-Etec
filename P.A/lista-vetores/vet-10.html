<script>
  
    let notas = [];
    let soma = 0;
    let aprovados = 0;
    let reprovados = 0;
    let media = 0;
    
    for (let i = 0; i < 10; i++) {
        notas[i] = Number(prompt("Digite a nota do aluno:"));
    
        soma = soma + notas[i];
    
        if (notas[i] >= 6) {
            aprovados++;
        } else {
            reprovados++;
        }
    }
    
    media = soma / 10;
    
    document.write("Notas: " + notas + "<br>" + "Média da turma: " + media + "<br>" + "Aprovados: " + aprovados + "<br>" + "Reprovados: " + reprovados);
  
</script>
