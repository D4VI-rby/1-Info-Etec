<script>
    let maior;
    let menor;
    let vetorA=[];

     for(let i=0; i<10;i++){
        vetorA[i] = Number(prompt("Entre com o "+(i+1)+"o. valor de A:"));
     

        if(i == 0) {
            maior = vetorA[0];
            menor = vetorA[0];
        }

        if(vetorA[i] > maior){
            maior = vetorA[i];
        }

        if(vetorA[i] < menor){
            menor = vetorA[i];
        }

     }
    
    document.write("<br>Maior Valor: " +maior);
    document.write("<br>Menor Valor : " +menor);

</script>
