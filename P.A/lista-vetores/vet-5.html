<script>
    let par = 0;
    let impar = 0;

    let vetorA=[];

     for(let i=0; i<5;i++){
        vetorA[i] = Number(prompt("Entre com o "+(i+1)+"o. valor de A:"));
     

        if(vetorA[i] % 2 == 0) {
            par++;
        }else{
            impar++;
        }


     }
    
    document.write("<br>essa é a quantidade de pares: " +par);
    document.write("<br>essa é a quantidade de impares : " +impar);

</script>
