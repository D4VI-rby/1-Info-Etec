<script>
    var numero = 0;

    for (numero=1;numero<=100;numero++) {
        if (numero % 2 == 0) {
            if (numero % 10 == 0) {
                document.write(numero + " - eh multiplo de 10 <br>");
            } else {
                document.write(numero + "<br>");   
            }
        }
    };
</script>
