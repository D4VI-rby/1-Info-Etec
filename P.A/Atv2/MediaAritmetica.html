<Script>
    var valor1=parseInt(prompt("Insira sua primeira nota"));//primeiro valor
    var valor2=parseInt(prompt("Insira sua segunda nota"));//segundo valor
    var valor3=parseInt(prompt("insira sua terceira nota"));//terceiro valor
    var valor4=parseInt(prompt("Insira sua quarta nota"));//quarto valor
    var media=(valor1+valor2+valor3+valor4)/4//calculo
    document.write("nota final= "+media);//apresentação :tuff:
</Script>
