<script>
    var valor1=parseInt(prompt("Insira o valor da prestação"));
    var tempo1=parseInt(prompt("Insira os dias de atraso"));
    var taxa1=parseInt(prompt("insira a taxa"));
    var prestacao= valor1 + (valor1 * (taxa1/100)*tempo1)
    document.write("o valor da sua prestação = " +prestacao)
</script>
