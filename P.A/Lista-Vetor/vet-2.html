<script>
    let vetorA=[];
     for(let i=0; i<10;i++){
        vetorA[i] = parseInt((prompt("Entre com o "+(i+1)+"o. valor de A:")));
      }

    let soma =0;
    for(let i=0; i<10;i++){
        soma += vetorA[i];
      }

    document.write("Vetor A: ", vetorA+"<br><br>");
    document.write("a soma dos valores é: ", soma);
</script>
