<script>
    var idade= parseInt(prompt("Digite sua idade"))
    document.write('sua idade eh' +idade +"<br>")

    if (idade <= 10) {
        document.write("dente de leite" );
    } else if (idade <= 14) {
        document.write("sub juvenil");
    } else if (idade <= 16) {
        document.write("juvenil");
    } else if (idade <= 20) {
        document.write("aspirante");
    } else {
        document.write("profissional");
    }
</script>
