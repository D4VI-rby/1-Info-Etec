<script>
    var valor= parseFloat(prompt("insira o valor da compra"))

    if(valor>1000){
        var valor2= valor*(10/100)
        var valorf2= valor - valor2
        document.write("desconto de 10%" +valorf2)
    } else{
        var valor3= valor*(5/100)
        var valorf3= valor - valor3
        document.write("desconto de 5%" +valorf3)
    }
</script>
