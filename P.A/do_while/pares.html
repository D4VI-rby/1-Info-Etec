<script>
    var numero = 0;

    do {
        if (numero % 2 == 0) {
            if (numero % 10 == 0) {
                document.write(numero + " - eh multiplo de 10 <br>");
            } else {
                document.write(numero + "<br>");
            }
        }
        numero++;
    } while (numero <= 500);
</script>
